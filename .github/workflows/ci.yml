name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run test -w @repolens/api
      - run: npm run test -w @repolens/web
      - run: pip install -r services/analyzer/requirements.txt
      - run: pytest -q
        working-directory: services/analyzer
